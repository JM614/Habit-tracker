<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rastreador de Hábitos</title>
<style>
:root {
  --bg: #e9e5d8;
  --surface: #ffffff;
  --text: #22252a;
  --text-dim: #6b7280;
  --border: #d8d3c5;
  --heat-empty: #ddd8ca;
  --accent: #2f9e44;
  --accent-soft: #d3f2dd;
  --danger: #e03131;
  --sleep-mid: #e8a83c;
  --shadow: 0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
  --radius: 14px;
}

[data-theme="dark"] {
  --bg: #16181d;
  --surface: #1e2127;
  --text: #eceef0;
  --text-dim: #9aa0a8;
  --border: #2c2f36;
  --heat-empty: #343841;
  --accent: #51cf66;
  --accent-soft: #1e3a26;
  --danger: #ff6b6b;
  --sleep-mid: #f2b93d;
  --shadow: 0 1px 3px rgba(0,0,0,0.4);
}

* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  background: var(--bg);
  color: var(--text);
  transition: background 0.2s, color 0.2s;
}

.app {
  max-width: 1200px;
  margin: 0 auto;
  padding: 32px 20px 80px;
}

header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 16px;
  gap: 12px;
}

h1 {
  font-size: 1.6rem;
  margin: 0;
}

.header-actions {
  display: flex;
  gap: 8px;
  flex-shrink: 0;
}

.icon-btn {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 10px;
  width: 40px;
  height: 40px;
  font-size: 1.1rem;
  cursor: pointer;
  box-shadow: var(--shadow);
  color: var(--text);
}

.notice {
  border-radius: var(--radius);
  padding: 12px 14px;
  margin-bottom: 16px;
  font-size: 0.88rem;
  line-height: 1.4;
  border: 1px solid var(--border);
  background: var(--surface);
  box-shadow: var(--shadow);
}

.notice.warn {
  border-color: var(--danger);
  color: var(--danger);
}

.notice.ok {
  border-color: var(--accent);
  color: var(--accent);
}

.date-bar {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 10px 12px;
  margin-bottom: 16px;
  box-shadow: var(--shadow);
}

.date-bar .icon-btn {
  width: 44px;
  height: 44px;
  font-size: 1.3rem;
  line-height: 1;
}

.date-input {
  flex: 1;
  min-width: 140px;
  padding: 11px 12px;
  border-radius: 10px;
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--text);
  font-size: 0.95rem;
  font-weight: 600;
}

.date-input:focus {
  outline: 2px solid var(--accent);
  outline-offset: 1px;
}

.btn-ghost {
  padding: 11px 16px;
  border-radius: 10px;
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--text);
  font-size: 0.9rem;
  font-weight: 600;
  cursor: pointer;
}

.btn-ghost:hover { border-color: var(--accent); }

.date-warning {
  flex-basis: 100%;
  font-size: 0.85rem;
  font-weight: 700;
  color: var(--sleep-mid);
}

.stats {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
  margin-bottom: 24px;
}

.stat-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 16px 8px;
  text-align: center;
  box-shadow: var(--shadow);
}

.stat-value {
  display: block;
  font-size: 1.5rem;
  font-weight: 700;
  color: var(--accent);
}

.stat-label {
  font-size: 0.78rem;
  color: var(--text-dim);
}

.sleep-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 20px;
  box-shadow: var(--shadow);
  margin-bottom: 24px;
}

.sleep-top {
  display: flex;
  align-items: center;
  gap: 24px;
  flex-wrap: wrap;
}

.sleep-status {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  padding: 10px 20px;
  border-radius: var(--radius);
  background: var(--bg);
  flex-shrink: 0;
}

.sleep-status-emoji {
  font-size: 1.8rem;
  line-height: 1;
}

.sleep-status-label {
  font-size: 0.8rem;
  font-weight: 700;
}

.sleep-status-label.good { color: var(--accent); }
.sleep-status-label.mid { color: var(--sleep-mid); }
.sleep-status-label.bad { color: var(--danger); }
.sleep-status-label.none { color: var(--text-dim); }

.sleep-gauge-wrap {
  position: relative;
  width: 160px;
  height: 90px;
  flex-shrink: 0;
}

.sleep-gauge {
  display: block;
}

.gauge-track {
  fill: none;
  stroke: var(--heat-empty);
  stroke-width: 12;
  stroke-linecap: round;
}

.gauge-fill {
  fill: none;
  stroke: var(--accent);
  stroke-width: 12;
  stroke-linecap: round;
  stroke-dasharray: 50 100;
  transition: stroke-dasharray 0.15s;
}

.sleep-gauge-value {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 4px;
  text-align: center;
  font-weight: 700;
  font-size: 1.6rem;
  color: var(--text);
}

.sleep-gauge-max {
  font-size: 0.85rem;
  font-weight: 500;
  color: var(--text-dim);
}

.sleep-controls {
  flex: 1;
  min-width: 220px;
  display: flex;
  flex-direction: column;
  gap: 16px;
}

.sleep-field {
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.sleep-label {
  font-size: 0.8rem;
  font-weight: 600;
  color: var(--text-dim);
}

.sleep-controls input[type="range"] {
  width: 100%;
  accent-color: var(--accent);
}

.sleep-controls input[type="number"] {
  padding: 10px 12px;
  border-radius: 10px;
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--text);
  font-size: 0.95rem;
  max-width: 140px;
}

.sleep-controls input:focus {
  outline: 2px solid var(--accent);
  outline-offset: 1px;
}

.add-form {
  display: flex;
  gap: 8px;
  margin-bottom: 24px;
}

.add-form input {
  flex: 1;
  padding: 12px 14px;
  border-radius: 10px;
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--text);
  font-size: 0.95rem;
}

.add-form input:focus {
  outline: 2px solid var(--accent);
  outline-offset: 1px;
}

.add-form button {
  padding: 12px 18px;
  border: none;
  border-radius: 10px;
  background: var(--accent);
  color: white;
  font-weight: 600;
  cursor: pointer;
}

.add-form button:hover { filter: brightness(1.05); }

.habit-list {
  list-style: none;
  margin: 0;
  padding: 0;
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
  gap: 12px;
  align-items: start;
}

.habit-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 14px 16px;
  box-shadow: var(--shadow);
}

.habit-row {
  display: flex;
  align-items: center;
  gap: 10px;
}

.drag-handle {
  cursor: grab;
  color: var(--text-dim);
  font-size: 1rem;
  padding: 4px;
  flex-shrink: 0;
  touch-action: none;
}

.drag-handle:active {
  cursor: grabbing;
}

.habit-card.dragging {
  opacity: 0.5;
}

.habit-card.drag-over {
  border-color: var(--accent);
}

.check-btn {
  width: 30px;
  height: 30px;
  border-radius: 50%;
  border: 2px solid var(--accent);
  background: transparent;
  cursor: pointer;
  flex-shrink: 0;
  position: relative;
  transition: background 0.15s;
}

.check-btn.done {
  background: var(--accent);
}

.check-btn.done::after {
  content: "✓";
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  color: white;
  font-size: 0.9rem;
}

.habit-name {
  flex: 1;
  font-weight: 600;
  font-size: 1rem;
}

.habit-streak {
  font-size: 0.8rem;
  color: var(--text-dim);
  white-space: nowrap;
}

.delete-btn {
  background: transparent;
  border: none;
  color: var(--text-dim);
  cursor: pointer;
  font-size: 0.95rem;
  padding: 4px;
}

.delete-btn:hover { color: var(--danger); }

.heatmap {
  display: grid;
  grid-template-rows: repeat(7, 1fr);
  grid-auto-flow: column;
  gap: 3px;
  margin-top: 14px;
  overflow-x: auto;
  padding-bottom: 4px;
}

.heat-cell {
  width: 11px;
  height: 11px;
  border-radius: 2px;
  background: var(--heat-empty);
  cursor: pointer;
}

.heat-cell.on,
.heat-cell.sleep-good {
  background: var(--accent);
}

.heat-cell.sleep-mid {
  background: var(--sleep-mid);
}

.heat-cell.sleep-bad {
  background: var(--danger);
}

.heat-cell.today {
  outline: 1.5px solid var(--text-dim);
  outline-offset: 1px;
}

.empty-state {
  text-align: center;
  color: var(--text-dim);
  margin-top: 40px;
  display: none;
}
</style>
</head>
<body>
  <div class="app">
    <header>
      <h1>Mis Hábitos</h1>
      <div class="header-actions">
        <button id="themeToggle" class="icon-btn" title="Cambiar tema">🌙</button>
      </div>
    </header>

    <div id="notice" class="notice" hidden></div>

    <section class="date-bar">
      <button class="icon-btn" id="prevDayBtn" title="Día anterior" aria-label="Día anterior">‹</button>
      <input type="date" id="activeDateInput" class="date-input" aria-label="Fecha activa">
      <button class="icon-btn" id="nextDayBtn" title="Día siguiente" aria-label="Día siguiente">›</button>
      <button class="btn-ghost" id="todayBtn">Hoy</button>
      <span class="date-warning" id="dateWarning" hidden></span>
    </section>

    <section class="stats" id="stats">
      <div class="stat-card">
        <span class="stat-value" id="statToday">0%</span>
        <span class="stat-label" id="statTodayLabel">Hoy</span>
      </div>
      <div class="stat-card">
        <span class="stat-value" id="statHabits">0</span>
        <span class="stat-label">Hábitos</span>
      </div>
      <div class="stat-card">
        <span class="stat-value" id="statBestStreak">0</span>
        <span class="stat-label">Mejor racha</span>
      </div>
    </section>

    <section class="sleep-card" id="sleepCard">
      <div class="sleep-top">
        <div class="sleep-gauge-wrap">
          <svg class="sleep-gauge" viewBox="0 0 160 90">
            <path class="gauge-track" d="M 15 80 A 65 65 0 0 1 145 80" pathLength="100"></path>
            <path class="gauge-fill" id="gaugeFill" d="M 15 80 A 65 65 0 0 1 145 80" pathLength="100"></path>
          </svg>
          <div class="sleep-gauge-value">
            <span id="sleepQualityValue">5</span><span class="sleep-gauge-max">/10</span>
          </div>
        </div>
        <div class="sleep-controls">
          <div class="sleep-field">
            <label class="sleep-label" for="sleepQualityInput">🌙 Calidad del sueño</label>
            <input type="range" id="sleepQualityInput" min="1" max="10" step="1" value="5">
          </div>
          <div class="sleep-field">
            <label class="sleep-label" for="sleepHoursInput">Horas dormidas</label>
            <input type="number" id="sleepHoursInput" min="0" max="24" step="0.5" placeholder="ej. 7.5">
          </div>
        </div>
        <div class="sleep-status" id="sleepStatus">
          <span class="sleep-status-emoji" id="sleepStatusEmoji">😐</span>
          <span class="sleep-status-label" id="sleepStatusLabel">Regular</span>
        </div>
      </div>
      <div class="heatmap" id="sleepHeatmap"></div>
    </section>

    <form id="addForm" class="add-form">
      <input type="text" id="habitInput" placeholder="Nuevo hábito (ej. Leer 10 min)" maxlength="40" required>
      <button type="submit">Añadir</button>
    </form>

    <ul id="habitList" class="habit-list"></ul>

    <p id="emptyState" class="empty-state">Aún no tienes hábitos. ¡Añade el primero arriba! 👆</p>
  </div>

  <template id="habitTemplate">
    <li class="habit-card">
      <div class="habit-row">
        <span class="drag-handle" title="Arrastrar para reordenar">⠿</span>
        <button class="check-btn" title="Marcar hoy"></button>
        <span class="habit-name"></span>
        <span class="habit-streak"></span>
        <button class="delete-btn" title="Eliminar hábito">✕</button>
      </div>
      <div class="heatmap"></div>
    </li>
  </template>

<script>
const STORAGE_KEY_V1 = "habit-tracker-data-v1";
const STORAGE_KEY = "habit-tracker-data-v2";
const BACKUP_PREFIX = "habit-tracker-backup-";
const SCHEMA_VERSION = 2;
const THEME_KEY = "habit-tracker-theme";
const WEEKS_VISIBLE = 12;

const noticeEl = document.getElementById("notice");
const activeDateInput = document.getElementById("activeDateInput");
const prevDayBtn = document.getElementById("prevDayBtn");
const nextDayBtn = document.getElementById("nextDayBtn");
const todayBtn = document.getElementById("todayBtn");
const dateWarning = document.getElementById("dateWarning");

const state = loadState();

const habitList = document.getElementById("habitList");
const emptyState = document.getElementById("emptyState");
const addForm = document.getElementById("addForm");
const habitInput = document.getElementById("habitInput");
const template = document.getElementById("habitTemplate");
const themeToggle = document.getElementById("themeToggle");
const sleepQualityInput = document.getElementById("sleepQualityInput");
const sleepHoursInput = document.getElementById("sleepHoursInput");
const sleepQualityValue = document.getElementById("sleepQualityValue");
const gaugeFill = document.getElementById("gaugeFill");
const sleepStatusEmoji = document.getElementById("sleepStatusEmoji");
const sleepStatusLabel = document.getElementById("sleepStatusLabel");
const sleepHeatmap = document.getElementById("sleepHeatmap");

const SLEEP_CATEGORY_INFO = {
  good: { emoji: "😊", label: "Bien" },
  mid: { emoji: "😐", label: "Regular" },
  bad: { emoji: "😞", label: "Mal" },
  none: { emoji: "🌙", label: "Sin datos" },
};

function uid() {
  return crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random().toString(16).slice(2);
}

function readRaw(key) {
  try {
    return localStorage.getItem(key);
  } catch (e) {
    return null;
  }
}

function writeRaw(key, value) {
  try {
    localStorage.setItem(key, value);
    return true;
  } catch (e) {
    return false;
  }
}

function showNotice(message, kind) {
  if (!noticeEl) return;
  noticeEl.textContent = message;
  noticeEl.className = "notice" + (kind ? " " + kind : "");
  noticeEl.hidden = false;
}

/** Estado v2 vacío, con todas las colecciones presentes. */
function createEmptyState() {
  return {
    schemaVersion: SCHEMA_VERSION,
    habits: [],
    sleep: {},
    recovery: {},
    gym: [],
    marks: [],
    races: [],
  };
}

function isPlainObject(value) {
  return !!value && typeof value === "object" && !Array.isArray(value);
}

/**
 * Devuelve siempre un estado v2 completo: si falta una colección la inicializa
 * vacía en vez de dejar que el render truene más adelante.
 */
function normalizeState(input) {
  const out = createEmptyState();
  if (!isPlainObject(input)) return out;

  if (Array.isArray(input.habits)) {
    out.habits = input.habits.filter(isPlainObject).map((h) => ({
      id: h.id != null ? String(h.id) : uid(),
      name: typeof h.name === "string" && h.name.trim() ? h.name : "Hábito sin nombre",
      dates: isPlainObject(h.dates) ? h.dates : {},
      createdAt: typeof h.createdAt === "string" ? h.createdAt : todayKey(),
    }));
  }
  if (isPlainObject(input.sleep)) out.sleep = input.sleep;
  if (isPlainObject(input.recovery)) out.recovery = input.recovery;
  if (Array.isArray(input.gym)) out.gym = input.gym.filter(isPlainObject);
  if (Array.isArray(input.marks)) out.marks = input.marks.filter(isPlainObject);
  if (Array.isArray(input.races)) out.races = input.races.filter(isPlainObject);

  return out;
}

/** Guarda el texto ilegible antes de arrancar limpio, para no perderlo en silencio. */
function backupCorrupt(sourceKey, raw) {
  const stamp = new Date().toISOString().replace(/[:.]/g, "-");
  writeRaw(`${BACKUP_PREFIX}${sourceKey}-${stamp}`, raw);
}

/**
 * Migra habit-tracker-data-v1 a v2. La llave v1 NO se borra ni se sobrescribe:
 * queda como respaldo de los datos ya capturados.
 */
function migrateFromV1(rawV1) {
  const migrated = normalizeState(JSON.parse(rawV1));
  migrated.schemaVersion = SCHEMA_VERSION;
  writeRaw(STORAGE_KEY, JSON.stringify(migrated));
  return migrated;
}

function loadState() {
  const rawV2 = readRaw(STORAGE_KEY);
  if (rawV2 != null) {
    try {
      return normalizeState(JSON.parse(rawV2));
    } catch (e) {
      backupCorrupt(STORAGE_KEY, rawV2);
      showNotice(
        "Los datos guardados estaban dañados y no se pudieron leer. Se guardó una copia del texto original y la página arrancó vacía.",
        "warn"
      );
      return createEmptyState();
    }
  }

  const rawV1 = readRaw(STORAGE_KEY_V1);
  if (rawV1 != null) {
    try {
      const migrated = migrateFromV1(rawV1);
      showNotice(
        "Datos migrados a la versión 2. La copia anterior sigue guardada como respaldo.",
        "ok"
      );
      return migrated;
    } catch (e) {
      backupCorrupt(STORAGE_KEY_V1, rawV1);
      showNotice(
        "No se pudo migrar el respaldo anterior porque estaba dañado. Se guardó una copia del texto original y la página arrancó vacía.",
        "warn"
      );
      return createEmptyState();
    }
  }

  return createEmptyState();
}

function saveState() {
  if (!writeRaw(STORAGE_KEY, JSON.stringify(state))) {
    showNotice("No se pudo guardar en este navegador. Revisa el espacio disponible.", "warn");
  }
}

function todayKey() {
  return dateKey(new Date());
}

function dateKey(d) {
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, "0");
  const day = String(d.getDate()).padStart(2, "0");
  return `${y}-${m}-${day}`;
}

function parseKey(key) {
  const [y, m, d] = key.split("-").map(Number);
  return new Date(y, m - 1, d);
}

function shiftKey(key, days) {
  const d = parseKey(key);
  d.setDate(d.getDate() + days);
  return dateKey(d);
}

/* ---------- Fecha activa ---------- */

let activeDate = todayKey();

function isActiveToday() {
  return activeDate === todayKey();
}

function formatLongDate(key) {
  return parseKey(key).toLocaleDateString("es", {
    weekday: "long",
    day: "numeric",
    month: "long",
  });
}

function setActiveDate(key) {
  const max = todayKey();
  activeDate = key > max ? max : key;
  renderDateBar();
  render();
  renderSleep();
}

/** Salta a un día desde un heatmap y lleva la vista a la tarjeta de captura. */
function focusDate(key, scrollTarget) {
  setActiveDate(key);
  if (scrollTarget && scrollTarget.scrollIntoView) {
    scrollTarget.scrollIntoView({ behavior: "smooth", block: "center" });
  }
}

function renderDateBar() {
  activeDateInput.value = activeDate;
  activeDateInput.max = todayKey();
  nextDayBtn.disabled = isActiveToday();
  nextDayBtn.style.opacity = isActiveToday() ? "0.4" : "1";
  todayBtn.disabled = isActiveToday();

  if (isActiveToday()) {
    dateWarning.hidden = true;
    dateWarning.textContent = "";
  } else {
    dateWarning.hidden = false;
    dateWarning.textContent = `⚠️ Estás editando ${formatLongDate(activeDate)}, no hoy.`;
  }
}

prevDayBtn.addEventListener("click", () => setActiveDate(shiftKey(activeDate, -1)));
nextDayBtn.addEventListener("click", () => setActiveDate(shiftKey(activeDate, 1)));
todayBtn.addEventListener("click", () => setActiveDate(todayKey()));
activeDateInput.addEventListener("change", (e) => {
  if (e.target.value) setActiveDate(e.target.value);
  else renderDateBar();
});

function addHabit(name) {
  state.habits.push({
    id: uid(),
    name,
    dates: {},
    createdAt: todayKey(),
  });
  saveState();
  render();
}

function deleteHabit(id) {
  state.habits = state.habits.filter((h) => h.id !== id);
  saveState();
  render();
}

function reorderHabits(draggedId, targetId) {
  const fromIndex = state.habits.findIndex((h) => h.id === draggedId);
  const toIndex = state.habits.findIndex((h) => h.id === targetId);
  if (fromIndex === -1 || toIndex === -1 || fromIndex === toIndex) return;
  const [moved] = state.habits.splice(fromIndex, 1);
  state.habits.splice(toIndex, 0, moved);
  saveState();
  render();
}

function toggleDate(habit, key) {
  if (habit.dates[key]) {
    delete habit.dates[key];
  } else {
    habit.dates[key] = true;
  }
  saveState();
  render();
}

function computeStreak(habit) {
  let streak = 0;
  let cursor = new Date();
  if (!habit.dates[todayKey()]) {
    cursor.setDate(cursor.getDate() - 1);
  }
  while (habit.dates[dateKey(cursor)]) {
    streak++;
    cursor.setDate(cursor.getDate() - 1);
  }
  return streak;
}

function computeBestStreakAcrossAll() {
  let best = 0;
  for (const habit of state.habits) {
    const dates = Object.keys(habit.dates).sort();
    let run = 0;
    let prev = null;
    for (const key of dates) {
      const d = new Date(key + "T00:00:00");
      if (prev) {
        const diff = (d - prev) / 86400000;
        run = diff === 1 ? run + 1 : 1;
      } else {
        run = 1;
      }
      best = Math.max(best, run);
      prev = d;
    }
  }
  return best;
}

function buildHeatmapDays() {
  const days = [];
  const totalDays = WEEKS_VISIBLE * 7;
  const end = new Date();
  const start = new Date(end);
  start.setDate(start.getDate() - totalDays + 1);
  for (let i = 0; i < totalDays; i++) {
    const d = new Date(start);
    d.setDate(start.getDate() + i);
    days.push(d);
  }
  return days;
}

function renderHeatmap(container, habit) {
  container.innerHTML = "";
  const days = buildHeatmapDays();
  for (const d of days) {
    const key = dateKey(d);
    const cell = document.createElement("div");
    cell.className =
      "heat-cell" + (habit.dates[key] ? " on" : "") + (key === activeDate ? " today" : "");
    cell.title = `${key}${habit.dates[key] ? " ✓" : ""}`;
    cell.addEventListener("click", () => {
      // Ver un hueco y llenarlo: marca el día y deja la fecha activa ahí.
      toggleDate(habit, key);
      setActiveDate(key);
    });
    container.appendChild(cell);
  }
}

function render() {
  habitList.innerHTML = "";
  emptyState.style.display = state.habits.length === 0 ? "block" : "none";

  for (const habit of state.habits) {
    const node = template.content.cloneNode(true);
    const card = node.querySelector(".habit-card");
    const dragHandle = node.querySelector(".drag-handle");
    const checkBtn = node.querySelector(".check-btn");
    const nameEl = node.querySelector(".habit-name");
    const streakEl = node.querySelector(".habit-streak");
    const deleteBtn = node.querySelector(".delete-btn");
    const heatmap = node.querySelector(".heatmap");

    nameEl.textContent = habit.name;
    const doneOnActive = !!habit.dates[activeDate];
    checkBtn.classList.toggle("done", doneOnActive);
    checkBtn.title = isActiveToday() ? "Marcar hoy" : `Marcar ${activeDate}`;
    checkBtn.addEventListener("click", () => toggleDate(habit, activeDate));

    const streak = computeStreak(habit);
    streakEl.textContent = streak > 0 ? `🔥 ${streak} día${streak === 1 ? "" : "s"}` : "Sin racha";

    deleteBtn.addEventListener("click", () => {
      if (confirm(`¿Eliminar "${habit.name}"?`)) deleteHabit(habit.id);
    });

    card.draggable = false;
    dragHandle.addEventListener("mousedown", () => {
      card.draggable = true;
    });
    card.addEventListener("dragstart", (e) => {
      e.dataTransfer.effectAllowed = "move";
      e.dataTransfer.setData("text/plain", habit.id);
      card.classList.add("dragging");
    });
    card.addEventListener("dragend", () => {
      card.draggable = false;
      card.classList.remove("dragging");
    });
    card.addEventListener("dragenter", (e) => {
      e.preventDefault();
      card.classList.add("drag-over");
    });
    card.addEventListener("dragleave", () => {
      card.classList.remove("drag-over");
    });
    card.addEventListener("dragover", (e) => {
      e.preventDefault();
    });
    card.addEventListener("drop", (e) => {
      e.preventDefault();
      card.classList.remove("drag-over");
      const draggedId = e.dataTransfer.getData("text/plain");
      reorderHabits(draggedId, habit.id);
    });

    renderHeatmap(heatmap, habit);
    habitList.appendChild(node);
  }

  renderStats();
}

function getActiveSleep() {
  return state.sleep[activeDate] || {};
}

function setSleepQuality(value) {
  const key = activeDate;
  if (!state.sleep[key]) state.sleep[key] = {};
  state.sleep[key].quality = value;
  saveState();
  renderSleep();
}

function setSleepHours(value) {
  const key = activeDate;
  if (!state.sleep[key]) state.sleep[key] = {};
  state.sleep[key].hours = value;
  saveState();
  renderSleep();
}

function computeSleepScore(entry) {
  if (!entry || entry.quality == null) return null;
  if (entry.hours == null) return entry.quality;
  const deviation = entry.hours < 7 ? 7 - entry.hours : entry.hours > 9 ? entry.hours - 9 : 0;
  const hoursScore = Math.max(0, 10 - deviation * 2);
  return (entry.quality + hoursScore) / 2;
}

function sleepCategory(score) {
  if (score == null) return "none";
  if (score >= 7) return "good";
  if (score >= 4) return "mid";
  return "bad";
}

function renderSleep() {
  const entry = getActiveSleep();
  const quality = entry.quality != null ? entry.quality : 5;
  sleepQualityValue.textContent = String(quality);
  sleepQualityInput.value = String(quality);
  gaugeFill.style.strokeDasharray = `${quality * 10} 100`;
  sleepHoursInput.value = entry.hours != null ? entry.hours : "";

  const category = sleepCategory(computeSleepScore(entry));
  const info = SLEEP_CATEGORY_INFO[category];
  sleepStatusEmoji.textContent = info.emoji;
  sleepStatusLabel.textContent = info.label;
  sleepStatusLabel.className = `sleep-status-label ${category}`;

  renderSleepHeatmap();
}

function renderSleepHeatmap() {
  sleepHeatmap.innerHTML = "";
  const days = buildHeatmapDays();
  const card = document.getElementById("sleepCard");
  for (const d of days) {
    const key = dateKey(d);
    const entry = state.sleep[key];
    const category = sleepCategory(computeSleepScore(entry));
    const info = SLEEP_CATEGORY_INFO[category];
    const cell = document.createElement("div");
    cell.className =
      "heat-cell" +
      (category !== "none" ? ` sleep-${category}` : "") +
      (key === activeDate ? " today" : "");
    cell.title = `${key}: ${info.emoji} ${info.label}`;
    cell.addEventListener("click", () => focusDate(key, card));
    sleepHeatmap.appendChild(cell);
  }
}

sleepQualityInput.addEventListener("input", (e) => {
  setSleepQuality(Number(e.target.value));
});

sleepHoursInput.addEventListener("change", (e) => {
  const value = e.target.value === "" ? null : Number(e.target.value);
  setSleepHours(value);
});

function renderStats() {
  const total = state.habits.length;
  const doneOnActive = state.habits.filter((h) => h.dates[activeDate]).length;
  const pct = total === 0 ? 0 : Math.round((doneOnActive / total) * 100);

  document.getElementById("statToday").textContent = `${pct}%`;
  document.getElementById("statTodayLabel").textContent = isActiveToday() ? "Hoy" : "Día activo";
  document.getElementById("statHabits").textContent = String(total);
  document.getElementById("statBestStreak").textContent = String(computeBestStreakAcrossAll());
}

addForm.addEventListener("submit", (e) => {
  e.preventDefault();
  const name = habitInput.value.trim();
  if (!name) return;
  addHabit(name);
  habitInput.value = "";
  habitInput.focus();
});

function applyTheme(theme) {
  document.documentElement.setAttribute("data-theme", theme);
  themeToggle.textContent = theme === "dark" ? "☀️" : "🌙";
  try {
    localStorage.setItem(THEME_KEY, theme);
  } catch (e) {}
}

themeToggle.addEventListener("click", () => {
  const current = document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark";
  applyTheme(current);
});

(function initTheme() {
  let saved = null;
  try {
    saved = localStorage.getItem(THEME_KEY);
  } catch (e) {}
  const prefersDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
  applyTheme(saved || (prefersDark ? "dark" : "light"));
})();

renderDateBar();
render();
renderSleep();
</script>
</body>
